<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Huerta Lunar"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="theme-color" content="#0a1620"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<title>Calendario Lunar de Huerta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Concepto: almanaque de campo. Panel nocturno para la luna (único elemento llamativo),
   resto en tonos de hoja y suelo; datos en tipografía monoespaciada. */
:root {
  --bg: #E9EEE8; --card: #F7F9F5; --card2: #EDF1EA; --line: #D3DCD2; --line2: #B7C4B6;
  --ink: #14231B; --ink2: #44574C; --ink3: #5B6D61;
  --accent: #2D6A4F; --accent-ink: #FFFFFF; --accent-soft: #DCEBE1;
  --warn: #8A5200; --warn-soft: #F4E4C3; --bad: #B3261E; --bad-soft: #F6DAD6;
  --ev-riego: #2a78d6; --ev-abono: #eb6834; --ev-plagas: #1baf7a; --ev-poda: #eda100; --ev-cosecha: #e87ba4; --ev-nota: #6B7D71; --ev-siembra: #2D6A4F;
  --t-hoja: #2D7D55; --t-fruto: #B8571F; --t-raiz: #7A55A8;
  --moon-lit: #FFD43B; --moon-dark: #26407a; --moon-edge: rgba(176, 120, 0, .55); --moon-mar: #E59F00;
  --hero-1: #0A1620; --hero-2: #153047; --hero-ink: #EAF1F5; --hero-ink2: #A9BCCB; --hero-line: rgba(234, 241, 245, .16); --hero-gold: #E9D58A;
  --shadow: 0 1px 2px rgba(20, 35, 27, .05), 0 8px 24px rgba(20, 35, 27, .06);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B120F; --card: #131C17; --card2: #1A2520; --line: #25322B; --line2: #35463D;
    --ink: #E5EDE7; --ink2: #AABCAF; --ink3: #8A9D90;
    --accent: #7FD1A4; --accent-ink: #0B120F; --accent-soft: #1B3126;
    --warn: #E6B450; --warn-soft: #33290F; --bad: #FF8A80; --bad-soft: #3A1C1A;
    --ev-riego: #3987e5; --ev-abono: #d95926; --ev-plagas: #199e70; --ev-poda: #c98500; --ev-cosecha: #d55181; --ev-nota: #8A9D90; --ev-siembra: #7FD1A4;
    --t-hoja: #6FCB9F; --t-fruto: #E8905F; --t-raiz: #B79CE6;
    --moon-edge: rgba(255, 214, 77, .5); --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B120F; --card: #131C17; --card2: #1A2520; --line: #25322B; --line2: #35463D;
  --ink: #E5EDE7; --ink2: #AABCAF; --ink3: #8A9D90;
  --accent: #7FD1A4; --accent-ink: #0B120F; --accent-soft: #1B3126;
  --warn: #E6B450; --warn-soft: #33290F; --bad: #FF8A80; --bad-soft: #3A1C1A;
  --ev-riego: #3987e5; --ev-abono: #d95926; --ev-plagas: #199e70; --ev-poda: #c98500; --ev-cosecha: #d55181; --ev-nota: #8A9D90; --ev-siembra: #7FD1A4;
  --t-hoja: #6FCB9F; --t-fruto: #E8905F; --t-raiz: #B79CE6;
  --moon-edge: rgba(255, 214, 77, .5); --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--f-body);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.lock { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.shell { max-width: 1120px; margin: 0 auto; padding-bottom: 40px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 500 11px/1.3 var(--f-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--ink3); }
.muted { color: var(--ink3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Cabecera y navegación ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px 8px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand b { font: 700 17px/1.1 var(--f-display); letter-spacing: -.01em; }
.pill { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line2); background: var(--card); font-size: 12.5px; font-weight: 500; color: var(--ink2); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink3); }
.pill[data-s="nube"] i { background: var(--accent); }
.pill[data-s="conectando"] i { background: var(--warn); }
.pill[data-s="error"] i { background: var(--bad); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tab { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--ink3); font-weight: 600; font-size: 14px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab svg { width: 18px; height: 18px; }
@media (max-width: 719px) {
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0; gap: 0; justify-content: space-around;
    background: var(--card); border-top: 1px solid var(--line); border-bottom: 0;
    padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
  }
  .tab { flex: 1; flex-direction: column; gap: 3px; min-height: 52px; padding: 4px 2px; border: 0; margin: 0; border-radius: 10px; font-size: 11.5px; }
  .tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
  .shell { padding-bottom: 96px; }
}

/* ---------- Bloques base ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
.card > h2, .h2 { font: 600 18px/1.25 var(--f-display); letter-spacing: -.01em; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.stack { display: grid; gap: 16px; }
.g2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 819px) { .g2, .g3 { grid-template-columns: minmax(0, 1fr); } }
.view > * + * { margin-top: 16px; }
.view { animation: entra .25s ease both; }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } * { transition: none !important; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line2); background: var(--card); color: var(--ink); font-weight: 600; font-size: 14px; text-decoration: none; }
.btn:hover { background: var(--card2); }
.btn svg { width: 17px; height: 17px; flex: none; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink2); }
.btn.ghost:hover { background: var(--card2); }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: default; }

.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card2); color: var(--ink2); font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.urgent { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.soon, .chip.listo { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.ok { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.t i, .chip.ev i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip.ev { color: var(--ink2); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.fchip { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line2); background: transparent; color: var(--ink2); font-weight: 600; font-size: 13px; }
.fchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.ico { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--c, var(--ink2)); background: var(--card2); }
@supports (background: color-mix(in srgb, red 10%, transparent)) {
  .ico { background: color-mix(in srgb, var(--c, var(--ink3)) 15%, transparent); color: color-mix(in srgb, var(--c, var(--ink2)) 72%, var(--ink)); }
}
.ico svg { width: 18px; height: 18px; }
.empty { text-align: center; padding: 28px 16px; color: var(--ink2); display: grid; gap: 12px; justify-items: center; }
.empty b { font: 600 17px var(--f-display); color: var(--ink); }
.empty p { max-width: 38ch; }
.hint { font-size: 13px; color: var(--ink2); }

/* ---------- Luna ---------- */
.m-dark { fill: var(--moon-dark); }
.m-lit { fill: var(--moon-lit); }
.m-mar { fill: var(--moon-mar); opacity: .45; }
.m-edge { fill: none; stroke: var(--moon-edge); stroke-width: 1; }
.hero {
  --moon-lit: #FFDA4D; --moon-dark: #1b3263; --moon-edge: rgba(255, 214, 77, .55); --moon-mar: #E59F00;
  position: relative; overflow: hidden; border-radius: 22px; padding: 22px; color: var(--hero-ink);
  background:
    radial-gradient(1.2px 1.2px at 8% 18%, rgba(255,255,255,.85), transparent 60%),
    radial-gradient(1px 1px at 22% 72%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1.4px 1.4px at 44% 12%, rgba(255,255,255,.8), transparent 60%),
    radial-gradient(1px 1px at 63% 84%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1.3px 1.3px at 78% 26%, rgba(255,255,255,.75), transparent 60%),
    radial-gradient(1px 1px at 92% 64%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1px 1px at 35% 46%, rgba(255,255,255,.5), transparent 60%),
    linear-gradient(160deg, var(--hero-2), var(--hero-1) 70%);
}
.hero-top { display: flex; gap: 26px; align-items: center; }
.hero-moon { flex: none; filter: drop-shadow(0 0 30px rgba(255, 212, 59, .5)); }
.hero-moon svg { display: block; max-width: 100%; height: auto; }
.hero .eyebrow { color: var(--hero-ink2); }
.hero h1 { font: 700 clamp(30px, 6vw, 44px)/1.02 var(--f-display); letter-spacing: -.02em; margin: 6px 0 4px; text-wrap: balance; }
.hero-sub { color: var(--hero-gold); font-weight: 600; }
.hero-stats { display: flex; flex-wrap: wrap; gap: 8px 26px; margin-top: 16px; }
.hero-stats dt { font: 500 10.5px var(--f-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--hero-ink2); }
.hero-stats dd { font: 500 22px/1.2 var(--f-mono); }
.hero-stats small { font-size: 12px; color: var(--hero-ink2); }
.hero-consejo { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--hero-line); color: var(--hero-ink); max-width: 70ch; }
.hero-next { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.hero-next li { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .06); border: 1px solid var(--hero-line); min-width: 0; }
.hero-next li:first-child { background: rgba(233, 213, 138, .12); border-color: rgba(233, 213, 138, .4); }
.hero-next svg { flex: none; }
.hero-next b { display: block; font-size: 13px; line-height: 1.25; }
.hero-next span { display: block; font: 400 11.5px/1.35 var(--f-mono); color: var(--hero-ink2); }
@media (max-width: 719px) {
  .hero { padding: 18px; }
  .hero-top { flex-direction: column; align-items: flex-start; gap: 16px; }
  .hero-moon svg { width: 128px; height: 128px; }
  .hero-next { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ---------- Tareas, ventanas, consejos ---------- */
.rows > li { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.rows > li:first-child { border-top: 0; padding-top: 0; }
.rows .txt { flex: 1 1 150px; min-width: 0; }
.rows .txt b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.rows .txt span { font-size: 13px; color: var(--ink3); }
.rows .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.win { padding: 14px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); display: grid; gap: 6px; align-content: start; }
.win b { font: 600 15px var(--f-display); }
.acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 819px) { .acts { grid-template-columns: minmax(0, 1fr); } }
.act { display: flex; gap: 12px; align-items: flex-start; }
.act b { display: block; font-weight: 600; }
.act p { font-size: 13.5px; color: var(--ink2); margin-top: 2px; }
.act .chip { margin-top: 8px; }
.tips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
@media (max-width: 819px) { .tips { grid-template-columns: minmax(0, 1fr); } }
.tip { padding: 12px 0; border-top: 1px solid var(--line); }
.tip .eyebrow { margin-bottom: 3px; }
.tip b { font-weight: 600; }
.tip p { font-size: 13.5px; color: var(--ink2); margin-top: 2px; }

/* ---------- Calendario ---------- */
.cal-layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 819px) { .cal-layout { grid-template-columns: minmax(0, 1fr); } }
.cal-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.cal-nav select { min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line2); background: var(--card2); }
.cal-nav .sp { flex: 1; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-wd { text-align: center; font: 500 10.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); padding: 2px 0 6px; }
.day { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 2px; min-height: 62px; padding: 5px 2px 6px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--ink); }
.day:hover { background: var(--card2); }
.day.fuera { visibility: hidden; }
.day .n { font: 500 12.5px var(--f-mono); }
.day.hoy { border-color: var(--accent); }
.day.hoy .n { color: var(--accent); font-weight: 600; }
.day[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.day .q { position: absolute; top: 3px; right: 4px; font: 600 8.5px var(--f-mono); letter-spacing: .02em; color: var(--ink3); }
.day .dots { display: flex; gap: 3px; height: 6px; align-items: center; }
.day .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.day svg { display: block; }
@media (max-width: 480px) { .day { min-height: 56px; } .day svg { width: 22px; height: 22px; } }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; font-size: 12px; color: var(--ink3); }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.leyenda i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.leyenda b { font: 600 10px var(--f-mono); color: var(--ink2); }
.det-h { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
.det-h h2 { font: 700 21px/1.15 var(--f-display); letter-spacing: -.01em; text-transform: capitalize; }
.det-h p { color: var(--ink2); font-size: 14px; }
.det-h svg { flex: none; }
.sub-h { margin: 18px 0 8px; }
.tipo-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.tipo-row:first-of-type { border-top: 0; }

/* ---------- Cultivos ---------- */
.resumen { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0; overflow: hidden; }
.resumen > div { padding: 14px 16px; border-left: 1px solid var(--line); }
.resumen > div:first-child { border-left: 0; }
.resumen b { display: block; font: 700 26px/1.1 var(--f-display); }
.resumen span { font-size: 12.5px; color: var(--ink3); }
@media (max-width: 599px) {
  .resumen { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .resumen > div:nth-child(3) { border-left: 0; }
  .resumen > div:nth-child(n+3) { border-top: 1px solid var(--line); }
}
.barra { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.crops { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 16px; align-items: start; }
.crop { display: grid; gap: 14px; }
.crop-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.crop-h h3 { font: 700 18px/1.2 var(--f-display); letter-spacing: -.01em; overflow-wrap: anywhere; }
.crop-h .meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--ink3); }
.prog-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; color: var(--ink2); }
.prog-top b { font: 600 20px var(--f-mono); color: var(--ink); }
.prog { height: 8px; border-radius: 99px; background: var(--card2); border: 1px solid var(--line); margin: 6px 0; overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 99px; background: var(--c); }
.prog-f { display: flex; justify-content: space-between; font: 400 11.5px var(--f-mono); color: var(--ink3); }
.luna-l { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); }
.crop-f { display: flex; gap: 8px; flex-wrap: wrap; }
.det { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 12px; }
.mini li { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line); }
.mini li:first-child { border-top: 0; }
.mini time { font: 400 12px var(--f-mono); color: var(--ink3); flex: none; width: 52px; }
.mini .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.back-aviso { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 13.5px; font-weight: 500; }

/* ---------- Registro y gráficos ---------- */
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(84px, 30%) minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 13.5px; }
.bar-l { display: flex; align-items: center; gap: 8px; min-width: 0; overflow-wrap: anywhere; color: var(--ink2); }
.bar-l i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.bar-t { display: block; border-left: 1px solid var(--line2); padding: 3px 0; }
.bar { display: block; height: 16px; min-width: 2px; border-radius: 0 4px 4px 0; background: var(--c); }
.bar.cero { min-width: 0; width: 0 !important; }
.bar-v { font: 500 13px var(--f-mono); min-width: 54px; text-align: right; color: var(--ink); }
.nota-g { margin-top: 12px; font-size: 12.5px; color: var(--ink3); }
.data-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.h-filtros { display: flex; gap: 8px; flex-wrap: wrap; }

function nubeEscribir(c) {
  if (!Nube.col) return;
  var key = 'c_' + c.id;
  Nube.cola[key] = (Nube.cola[key] || Promise.resolve()).then(function () { return Nube.col.doc(key).set(c); }).catch(errNube);
}
function nubeBorrar(id) {
  if (!Nube.col) return;
  var key = 'c_' + id;
  Nube.cola[key] = (Nube.cola[key] || Promise.resolve()).then(function () { return Nube.col.doc(key).delete(); }).catch(errNube);
}
function errNube(e) {
  var code = e && e.code;
  if (code === 'quota_exceeded') { S.sync = 'error'; S.motivo = 'La nube alcanzó su límite de almacenamiento. Descargue un respaldo.'; }
  else if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked') { S.sync = 'local'; S.motivo = 'Esta cuenta no tiene permiso para guardar en la nube. Los datos quedan en este dispositivo.'; Nube.col = null; }
  else { S.sync = 'error'; S.motivo = 'No se pudo sincronizar. Sus datos siguen guardados en este dispositivo.'; }
  pintarEstado();
  if (!$('#overlay').hidden) return;
  toast(S.motivo);
}
function alSnapshot(snap) {
  if (snap.metadata && snap.metadata.fromCache) return; /* esperar la respuesta definitiva del servidor */
  var remotos = {}, hayMeta = false;
  snap.docs.forEach(function (d) {
    if (d.id === 'meta') { hayMeta = true; return; }
    if (d.id.indexOf('c_') !== 0) return;
    var c = normalizarCultivo(d.data());
    if (c) remotos[c.id] = c;
  });
  var lista = [], subir = [], vistos = {};
  Object.keys(remotos).forEach(function (id) {
    var r = remotos[id], l = porId(id);
    if (l && l.actualizado > r.actualizado) { lista.push(l); subir.push(l); } else lista.push(r);
    vistos[id] = 1;
  });
  S.cultivos.forEach(function (c) {
    if (vistos[c.id]) return;
    if (!sincronizados[c.id]) { lista.push(c); subir.push(c); } /* nunca llegó a la nube: se sube */
    /* si ya estuvo sincronizado y ya no está, fue eliminado desde otro dispositivo */
  });
  sincronizados = {};
  lista.forEach(function (c) { sincronizados[c.id] = 1; });
  S.cultivos = lista;
  subir.forEach(nubeEscribir);
  if (!hayMeta) Nube.col.doc('meta').set({ app: 'huerta-lunar', version: 2, creado: new Date().toISOString() }).catch(errNube);
  S.sync = 'nube'; S.motivo = '';
  lsEscribir(); render();
}
function iniciarNube() {
  if (!(window.claude && typeof window.claude.use === 'function')) { S.sync = 'local'; pintarEstado(); return; }
  S.sync = 'conectando'; pintarEstado();
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
    var db = r[0], user = r[1];
    if (!db || !user) { S.sync = 'local'; pintarEstado(); return null; }
    return user.id().then(function (uid) {
      if (!uid) { S.sync = 'local'; S.motivo = 'Inicie sesión en Claude para sincronizar entre dispositivos.'; pintarEstado(); return; }
      Nube.col = db.collection('data/users/' + uid);
      Nube.col.onSnapshot(alSnapshot, function (e) { errNube(e); });
    });
  }).catch(function () { S.sync = 'local'; pintarEstado(); });
}

/* ---------- Operaciones sobre los datos ---------- */
function porId(id) { for (var i = 0; i < S.cultivos.length; i++) if (S.cultivos[i].id === id) return S.cultivos[i]; return null; }
function clonar(o) { return JSON.parse(JSON.stringify(o)); }
function guardar(c, sinRender) {
  c.actualizado = new Date().toISOString();
  var i = -1;
  S.cultivos.forEach(function (x, k) { if (x.id === c.id) i = k; });
  if (i < 0) S.cultivos.push(c); else S.cultivos[i] = c;
  lsEscribir(); nubeEscribir(c);
  if (!sinRender) render();
}
function quitar(id, sinRender) {
  S.cultivos = S.cultivos.filter(function (c) { return c.id !== id; });
  lsEscribir(); nubeBorrar(id);
  if (!sinRender) render();
}
function agregarEvento(cid, ev, fin) {
  var c = porId(cid); if (!c) return null;
  var n = normalizarEvento(ev); if (!n) return null;
  var cc = clonar(c); cc.eventos.push(n);
  if (fin) cc.estado = 'cosechado';
  guardar(cc); return n;
}
function quitarEvento(cid, eid) {
  var c = porId(cid); if (!c) return null;
  var cc = clonar(c), ev = null;
  cc.eventos = cc.eventos.filter(function (e) { if (e.id === eid) { ev = e; return false; } return true; });
  if (ev) guardar(cc);
  return ev;
}
function rapido(cid, tipo, via) {
  var c = porId(cid); if (!c) return;
  var n = agregarEvento(cid, { fecha: hoyISO(), tipo: tipo, via: via });
  if (!n) return;
  toast((via === 'lluvia' ? 'Lluvia anotada como riego' : EV[tipo].l + ' registrado') + ' · ' + c.nombre, function () { quitarEvento(cid, n.id); });
}
function borrarEvento(cid, eid) {
  var ev = quitarEvento(cid, eid);
  if (!ev) return;
  toast('Actividad eliminada', function () {
    var c = porId(cid); if (!c) return;
    var cc = clonar(c); cc.eventos.push(ev); guardar(cc);
  });
}
function cambiarEstado(id) {
  var c = porId(id); if (!c) return;
  var cc = clonar(c); cc.estado = c.estado === 'activo' ? 'cosechado' : 'activo'; guardar(cc);
  toast(cc.estado === 'cosechado' ? 'Cultivo marcado como terminado' : 'Cultivo reactivado', function () { cambiarEstado(id); });
}
function eliminarCultivo(id) {
  var c = porId(id); if (!c) return;
  var copia = clonar(c);
  quitar(id); cerrarSheet();
  toast('Cultivo eliminado · ' + copia.nombre, function () { guardar(copia); });
}
function importarLista(lista) {
  var prev = clonar(S.cultivos), nuevos = 0, act = 0, omit = 0;
  lista.forEach(function (c) {
    var ex = porId(c.id);
    if (!ex) ex = S.cultivos.filter(function (x) { return x.nombre.toLowerCase() === c.nombre.toLowerCase() && x.fechaSiembra === c.fechaSiembra; })[0];
    if (!ex) { guardar(c, true); nuevos++; }
    else if (ex.id === c.id && c.actualizado > ex.actualizado) { guardar(c, true); act++; }
    else omit++;
  });
  render();
  return { prev: prev, nuevos: nuevos, act: act, omit: omit };
}
function restaurarEstado(prev) {
  var ids = {};
  prev.forEach(function (p) { ids[p.id] = 1; });
  S.cultivos.slice().forEach(function (c) { if (!ids[c.id]) quitar(c.id, true); });
  prev.forEach(function (p) { guardar(p, true); });
  render();
}

/* ---------- Mensajes y hoja inferior ---------- */
function toast(msg, undo) {
  var t = $('#toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button" class="btn sm" data-a="undo">Deshacer</button>' : '');
  t.hidden = false; undoFn = undo || null;
  clearTimeout(toastT);
  toastT = setTimeout(function () { t.hidden = true; undoFn = null; }, undo ? 9000 : 4500);
}
function abrirSheet(html) {
  sheetPrev = document.activeElement;
  $('#sheet').innerHTML = html;
  $('#overlay').hidden = false; document.body.classList.add('lock');
  var f = $('#sheet input:not([type=radio]):not([type=checkbox]), #sheet select, #sheet textarea');
  if (f && window.matchMedia && window.matchMedia('(min-width: 720px)').matches) { try { f.focus(); } catch (e) {} }
}
function cerrarSheet() {
  $('#overlay').hidden = true; $('#sheet').innerHTML = ''; document.body.classList.remove('lock');
  if (sheetPrev && sheetPrev.focus) { try { sheetPrev.focus(); } catch (e) {} }
}

function chipNivel(nivel, texto) { return '<span class="chip ' + nivel + '">' + esc(texto) + '</span>'; }
function eventosDelDia(iso) {
  var out = [];
  S.cultivos.forEach(function (c) {
    if (c.fechaSiembra === iso) out.push({ k: 'siembra', c: c, e: null });
    c.eventos.forEach(function (e) { if (e.fecha === iso) out.push({ k: e.tipo, c: c, e: e }); });
  });

}
function marcasMes(y, m) {
  var ord = ['siembra', 'riego', 'abono', 'plagas', 'poda', 'cosecha', 'nota'], mapa = {};
  var pref = y + '-' + pad(m + 1) + '-';
  S.cultivos.forEach(function (c) {
    if (c.fechaSiembra.indexOf(pref) === 0) (mapa[c.fechaSiembra] = mapa[c.fechaSiembra] || {}).siembra = 1;
    c.eventos.forEach(function (e) { if (e.fecha.indexOf(pref) === 0) (mapa[e.fecha] = mapa[e.fecha] || {})[e.tipo] = 1; });
  });
  Object.keys(mapa).forEach(function (k) { mapa[k] = ord.filter(function (o) { return mapa[k][o]; }); });
  return mapa;
}

function vistaHuerta() {

  var dr = diasRespaldo();

  h += '<div class="barra"><div class="chips" role="group" aria-label="Filtro">' + [['activos', 'Activos'], ['cosechados', 'Terminados'], ['todos', 'Todos']].map(function (f) {

  }).join('') + '</div><button class="btn primary" type="button" data-a="nuevo">' + ic('mas') + 'Agregar cultivo</button></div>';
  var lista = S.cultivos.filter(function (c) { return S.filtro === 'todos' || (S.filtro === 'activos') === (c.estado === 'activo'); })
    .sort(function (a, b) { return a.fechaSiembra < b.fechaSiembra ? 1 : a.fechaSiembra > b.fechaSiembra ? -1 : 0; });

/* ---------- Archivos: respaldo, CSV, importación ---------- */
function guardarArchivo(nombre, texto, mime) {
  var usar = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads') : Promise.resolve(null);
  return usar.then(function (dl) {
    if (dl) return dl.save({ filename: nombre, data: texto });
    var url = URL.createObjectURL(new Blob([texto], { type: mime })), a = document.createElement('a');
    a.href = url; a.download = nombre; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  });
}
function marcarRespaldo() { S.respaldo = new Date().toISOString(); lsEscribir(); render(); }
function exportar(tipo) {
  var json = tipo === 'json', hoy = hoyISO();
  guardarArchivo(json ? 'huerta-lunar-respaldo-' + hoy + '.json' : 'huerta-lunar-actividades-' + hoy + '.csv', json ? crearRespaldo(S.cultivos) : crearCSV(S.cultivos), json ? 'application/json' : 'text/csv')
    .then(function () { if (json) marcarRespaldo(); toast(json ? 'Respaldo guardado' : 'Actividades exportadas'); })
    .catch(function (e) { if (e && e.code === 'declined') return; toast('No se pudo descargar el archivo. Pruebe «Copiar respaldo».'); });
}
function copiarRespaldo() {
  var t = crearRespaldo(S.cultivos), ok = function () { marcarRespaldo(); toast('Respaldo copiado. Péguelo en un mensaje o nota para guardarlo.'); };
  var fallo = function () {
    abrirSheet('<h2>Copiar respaldo</h2><p class="sub">Seleccione todo el texto, cópielo y guárdelo en una nota o archivo. Para restaurarlo, guárdelo como archivo .json e impórtelo.</p><div class="field"><label for="cp-t">Respaldo</label><textarea id="cp-t" rows="8" readonly></textarea></div><div class="sheet-actions"><button type="button" class="btn primary" data-a="cerrar">Listo</button></div>');
    var ta = $('#cp-t'); ta.value = t; ta.focus(); ta.select();
  };
  try { navigator.clipboard.writeText(t).then(ok, fallo); } catch (e) { fallo(); }
}
function leerArchivo(file) {
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { toast('El archivo es demasiado grande para ser un respaldo.'); return; }
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var lista = leerRespaldo(String(fr.result));
      if (!lista.length) { toast('No se encontraron cultivos válidos en el archivo.'); return; }
      var r = importarLista(lista);
      toast('Importados: ' + plural(r.nuevos, 'cultivo nuevo', 'cultivos nuevos') + (r.act ? ', ' + r.act + ' actualizados' : '') + (r.omit ? ', ' + r.omit + ' ya existían' : ''), function () { restaurarEstado(r.prev); });
    } catch (e) { toast(e && e.message ? e.message : 'No se pudo leer el archivo.'); }
  };
  fr.onerror = function () { toast('No se pudo leer el archivo.'); };
  fr.readAsText(file);
}

  fin: function (d) { cambiarEstado(d.id); if (d.cerrar) cerrarSheet(); },
  eliminar: function (d) { confirmarEliminar(d.id); },
  'eliminar-ok': function (d) { eliminarCultivo(d.id); },
  'ev-del': function (d) { borrarEvento(d.id, d.e); },
  filtro: function (d) { S.filtro = d.f; render(); },
  'exp-json': function () { exportar('json'); },
  'exp-csv': function () { exportar('csv'); },
  copiar: copiarRespaldo,
  importar: function () { $('#file-in').value = ''; $('#file-in').click(); },
  'mas-hist': function () { S.hf.n += 60; render(); },
  cerrar: cerrarSheet,
  semilla: cargarSemilla,
  fase: function (d) { abrirFase(+d.i); },
  abono: function (d) { abrirAbono(d.id); },
  afiltro: function (d) { S.af = d.f; render(); },
  guia: function (d) { abrirGuia(d.id); },
  gtab: function (d) { abrirGuia(d.id, d.f); },
  undo: function () { var f = undoFn; undoFn = null; $('#toast').hidden = true; if (f) f(); }
};
document.addEventListener('click', function (e) {
  if (e.target.id === 'overlay') { cerrarSheet(); return; }
  var b = e.target.closest ? e.target.closest('[data-a]') : null;
  if (b && ACC[b.dataset.a]) ACC[b.dataset.a](b.dataset, b);
});
document.addEventListener('submit', function (e) {
  var f = e.target; if (!f.dataset || !f.dataset.form) return;
  e.preventDefault();
  if (f.dataset.form === 'cultivo') guardarFormCultivo(f); else if (f.dataset.form === 'evento') guardarFormEvento(f);
});
document.addEventListener('change', function (e) {
  var t = e.target, id = t.id;
  if (id === 'cal-mes' || id === 'cal-anio') { S.mes.m = +$('#cal-mes').value; S.mes.y = +$('#cal-anio').value; render(); }
  else if (id === 'hf-c') { S.hf.c = t.value; S.hf.n = 60; render(); }
  else if (id === 'hf-t') { S.hf.t = t.value; S.hf.n = 60; render(); }
  else if (id === 'fc-cat') aplicarCatalogo();
  else if (id === 'fc-tipo' || id === 'fc-fecha') hintCultivo();
  else if (t.name === 'fe-tipo') ajustarFormEvento();
  else if (id === 'file-in') leerArchivo(t.files && t.files[0]);
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#overlay').hidden) cerrarSheet(); });
window.addEventListener('hashchange', function () {
  var h = (location.hash || '').replace('#', '');
  if (h !== S.vista && VISTAS.some(function (v) { return v.k === h; })) { S.vista = h; S.animar = true; render(); window.scrollTo(0, 0); }
});
document.addEventListener('visibilitychange', function () { if (!document.hidden && $('#overlay').hidden && hoyISO() !== diaRender) { S.sel = hoyISO(); render(); } });

/* ---------- Inicio ---------- */
cargarLocal();
(function () { var h = (location.hash || '').replace('#', ''); if (VISTAS.some(function (v) { return v.k === h; })) S.vista = h; })();
render();
if (S.migrados) toast('Se recuperaron ' + plural(S.migrados, 'cultivo', 'cultivos') + ' de la versión anterior.');
iniciarNube();

})();
</script>
</body></html>
